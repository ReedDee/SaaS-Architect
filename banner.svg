<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1410"/>
      <stop offset="100%" style="stop-color:#0E0C0A"/>
    </linearGradient>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8603A"/>
      <stop offset="100%" style="stop-color:#A84E2E"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B4FB8"/>
      <stop offset="100%" style="stop-color:#5A40A0"/>
    </linearGradient>
    <filter id="glow-coral">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-violet">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2A2420" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="320" fill="url(#grid)" rx="12" opacity="0.5"/>

  <!-- Left glow -->
  <radialGradient id="leftglow" cx="0%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#C8603A;stop-opacity:0.12"/>
    <stop offset="100%" style="stop-color:#C8603A;stop-opacity:0"/>
  </radialGradient>
  <rect width="900" height="320" fill="url(#leftglow)" rx="12"/>

  <!-- Right glow -->
  <radialGradient id="rightglow" cx="100%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#6B4FB8;stop-opacity:0.10"/>
    <stop offset="100%" style="stop-color:#6B4FB8;stop-opacity:0"/>
  </radialGradient>
  <rect width="900" height="320" fill="url(#rightglow)" rx="12"/>

  <!-- ── LEFT: Title block ── -->
  <text x="48" y="72" font-size="11" fill="#C8603A" font-weight="600" letter-spacing="2" class="mono">/ ARCHITECT</text>
  <text x="48" y="120" font-size="38" fill="#F0EAE0" font-weight="700" letter-spacing="-1">SaaS Architect</text>
  <text x="48" y="148" font-size="14" fill="#8C8078">13-agent blueprint pipeline for Claude Code</text>

  <!-- Divider line -->
  <line x1="48" y1="168" x2="220" y2="168" stroke="#C8603A" stroke-width="1.5" opacity="0.6"/>

  <!-- Stats row -->
  <text x="48" y="192" font-size="11" fill="#C8603A" font-weight="600" class="mono">13</text>
  <text x="66" y="192" font-size="11" fill="#5C5650"> sections</text>
  <text x="118" y="192" font-size="11" fill="#5C5650">·</text>
  <text x="128" y="192" font-size="11" fill="#6B4FB8" font-weight="600" class="mono">6</text>
  <text x="143" y="192" font-size="11" fill="#5C5650"> support agents</text>
  <text x="248" y="192" font-size="11" fill="#5C5650">·</text>
  <text x="258" y="192" font-size="11" fill="#2E8A68" font-weight="600" class="mono">3</text>
  <text x="272" y="192" font-size="11" fill="#5C5650"> outputs</text>

  <!-- Output pills -->
  <rect x="48" y="210" width="62" height="20" rx="4" fill="#1C1A18" stroke="#3A70B0" stroke-width="1"/>
  <text x="79" y="224" font-size="10" fill="#3A70B0" text-anchor="middle" class="mono">plan.md</text>

  <rect x="118" y="210" width="60" height="20" rx="4" fill="#1C1A18" stroke="#2E8A68" stroke-width="1"/>
  <text x="148" y="224" font-size="10" fill="#2E8A68" text-anchor="middle" class="mono">spec.md</text>

  <rect x="186" y="210" width="68" height="20" rx="4" fill="#1C1A18" stroke="#6B4FB8" stroke-width="1"/>
  <text x="220" y="224" font-size="10" fill="#6B4FB8" text-anchor="middle" class="mono">prompt.md</text>

  <!-- ── CENTRE: Section agent grid ── -->
  <!-- Band labels -->
  <text x="340" y="34" font-size="9" fill="#3A70B0" font-weight="600" letter-spacing="1.5" text-anchor="middle">DISCOVERY</text>
  <text x="460" y="34" font-size="9" fill="#C8603A" font-weight="600" letter-spacing="1.5" text-anchor="middle">COMMERCIAL</text>
  <text x="580" y="34" font-size="9" fill="#2E8A68" font-weight="600" letter-spacing="1.5" text-anchor="middle">QUALITY</text>
  <text x="700" y="34" font-size="9" fill="#6B4FB8" font-weight="600" letter-spacing="1.5" text-anchor="middle">ENGINEERING</text>

  <!-- Band top bars -->
  <rect x="310" y="38" width="60" height="2" rx="1" fill="#3A70B0" opacity="0.7"/>
  <rect x="430" y="38" width="60" height="2" rx="1" fill="#C8603A" opacity="0.7"/>
  <rect x="550" y="38" width="60" height="2" rx="1" fill="#2E8A68" opacity="0.7"/>
  <rect x="670" y="38" width="60" height="2" rx="1" fill="#6B4FB8" opacity="0.7"/>

  <!-- Section nodes — row 1 -->
  <!-- S01 -->
  <rect x="310" y="50" width="60" height="36" rx="6" fill="#141210" stroke="#3A70B0" stroke-width="1"/>
  <text x="340" y="65" font-size="9" fill="#3A70B0" font-weight="700" text-anchor="middle" class="mono">S01</text>
  <text x="340" y="78" font-size="8" fill="#6A6058" text-anchor="middle">Vision</text>

  <!-- S02 -->
  <rect x="380" y="50" width="60" height="36" rx="6" fill="#141210" stroke="#3A70B0" stroke-width="1"/>
  <text x="410" y="65" font-size="9" fill="#3A70B0" font-weight="700" text-anchor="middle" class="mono">S02</text>
  <text x="410" y="78" font-size="8" fill="#6A6058" text-anchor="middle">Roles</text>

  <!-- S03 -->
  <rect x="450" y="50" width="60" height="36" rx="6" fill="#141210" stroke="#C8603A" stroke-width="1"/>
  <text x="480" y="65" font-size="9" fill="#C8603A" font-weight="700" text-anchor="middle" class="mono">S03</text>
  <text x="480" y="78" font-size="8" fill="#6A6058" text-anchor="middle">Features</text>

  <!-- S04 -->
  <rect x="520" y="50" width="60" height="36" rx="6" fill="#141210" stroke="#C8603A" stroke-width="1"/>
  <text x="550" y="65" font-size="9" fill="#C8603A" font-weight="700" text-anchor="middle" class="mono">S04</text>
  <text x="550" y="78" font-size="8" fill="#6A6058" text-anchor="middle">Monetise</text>

  <!-- S05 -->
  <rect x="590" y="50" width="60" height="36" rx="6" fill="#141210" stroke="#2E8A68" stroke-width="1"/>
  <text x="620" y="65" font-size="9" fill="#2E8A68" font-weight="700" text-anchor="middle" class="mono">S05</text>
  <text x="620" y="78" font-size="8" fill="#6A6058" text-anchor="middle">SEO/GTM</text>

  <!-- S06 -->
  <rect x="660" y="50" width="60" height="36" rx="6" fill="#141210" stroke="#2E8A68" stroke-width="1"/>
  <text x="690" y="65" font-size="9" fill="#2E8A68" font-weight="700" text-anchor="middle" class="mono">S06</text>
  <text x="690" y="78" font-size="8" fill="#6A6058" text-anchor="middle">A11y/i18n</text>

  <!-- S07 -->
  <rect x="730" y="50" width="60" height="36" rx="6" fill="#141210" stroke="#6B4FB8" stroke-width="1"/>
  <text x="760" y="65" font-size="9" fill="#6B4FB8" font-weight="700" text-anchor="middle" class="mono">S07</text>
  <text x="760" y="78" font-size="8" fill="#6A6058" text-anchor="middle">Analytics</text>

  <!-- Arrow row 1 → row 2 -->
  <line x1="340" y1="86" x2="340" y2="100" stroke="#2A2420" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="480" y1="86" x2="480" y2="100" stroke="#2A2420" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="620" y1="86" x2="620" y2="100" stroke="#2A2420" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="760" y1="86" x2="760" y2="100" stroke="#2A2420" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Section nodes — row 2 -->
  <!-- S08 -->
  <rect x="310" y="100" width="60" height="36" rx="6" fill="#141210" stroke="#3A70B0" stroke-width="1"/>
  <text x="340" y="115" font-size="9" fill="#3A70B0" font-weight="700" text-anchor="middle" class="mono">S08</text>
  <text x="340" y="128" font-size="8" fill="#6A6058" text-anchor="middle">UX/Brand</text>

  <!-- S09 -->
  <rect x="380" y="100" width="60" height="36" rx="6" fill="#141210" stroke="#3A70B0" stroke-width="1"/>
  <text x="410" y="115" font-size="9" fill="#3A70B0" font-weight="700" text-anchor="middle" class="mono">S09</text>
  <text x="410" y="128" font-size="8" fill="#6A6058" text-anchor="middle">Tech Arch</text>

  <!-- S10 -->
  <rect x="450" y="100" width="60" height="36" rx="6" fill="#141210" stroke="#C8603A" stroke-width="1"/>
  <text x="480" y="115" font-size="9" fill="#C8603A" font-weight="700" text-anchor="middle" class="mono">S10</text>
  <text x="480" y="128" font-size="8" fill="#6A6058" text-anchor="middle">Data Arch</text>

  <!-- S11 -->
  <rect x="520" y="100" width="60" height="36" rx="6" fill="#141210" stroke="#C8603A" stroke-width="1"/>
  <text x="550" y="115" font-size="9" fill="#C8603A" font-weight="700" text-anchor="middle" class="mono">S11</text>
  <text x="550" y="128" font-size="8" fill="#6A6058" text-anchor="middle">Security</text>

  <!-- S12 -->
  <rect x="590" y="100" width="60" height="36" rx="6" fill="#141210" stroke="#2E8A68" stroke-width="1"/>
  <text x="620" y="115" font-size="9" fill="#2E8A68" font-weight="700" text-anchor="middle" class="mono">S12</text>
  <text x="620" y="128" font-size="8" fill="#6A6058" text-anchor="middle">DevOps</text>

  <!-- S13 -->
  <rect x="660" y="100" width="60" height="36" rx="6" fill="#141210" stroke="#6B4FB8" stroke-width="1"/>
  <text x="690" y="115" font-size="9" fill="#6B4FB8" font-weight="700" text-anchor="middle" class="mono">S13</text>
  <text x="690" y="128" font-size="8" fill="#6A6058" text-anchor="middle">Testing</text>

  <!-- Converge arrows down to planner -->
  <line x1="340" y1="136" x2="340" y2="152" stroke="#C8603A" stroke-width="1" opacity="0.4"/>
  <line x1="410" y1="136" x2="410" y2="152" stroke="#C8603A" stroke-width="1" opacity="0.4"/>
  <line x1="480" y1="136" x2="480" y2="152" stroke="#C8603A" stroke-width="1" opacity="0.4"/>
  <line x1="550" y1="136" x2="550" y2="152" stroke="#C8603A" stroke-width="1" opacity="0.4"/>
  <line x1="620" y1="136" x2="620" y2="152" stroke="#C8603A" stroke-width="1" opacity="0.4"/>
  <line x1="690" y1="136" x2="690" y2="152" stroke="#C8603A" stroke-width="1" opacity="0.4"/>
  <line x1="760" y1="86" x2="760" y2="152" stroke="#6B4FB8" stroke-width="1" opacity="0.4"/>

  <!-- Convergence line -->
  <line x1="340" y1="152" x2="760" y2="152" stroke="#C8603A" stroke-width="1" opacity="0.3"/>
  <line x1="550" y1="152" x2="550" y2="168" stroke="#C8603A" stroke-width="1.5" opacity="0.6"/>

  <!-- ── PLANNER ── -->
  <rect x="490" y="168" width="120" height="38" rx="7" fill="#1C1410" stroke="#C8603A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="184" font-size="10" fill="#C8603A" font-weight="700" text-anchor="middle" class="mono">PLANNER</text>
  <text x="550" y="198" font-size="8" fill="#8C8078" text-anchor="middle">legal synthesis + plan</text>

  <!-- Planner → Executor arrow -->
  <line x1="550" y1="206" x2="550" y2="222" stroke="#C8603A" stroke-width="1.5" opacity="0.7"/>
  <polygon points="546,218 554,218 550,224" fill="#C8603A" opacity="0.7"/>

  <!-- ── EXECUTOR ── -->
  <rect x="476" y="224" width="148" height="42" rx="7" fill="#1E1610" stroke="#C8603A" stroke-width="2" filter="url(#glow-coral)"/>
  <text x="550" y="241" font-size="10" fill="#F0EAE0" font-weight="700" text-anchor="middle">🚀 EXECUTOR</text>
  <text x="550" y="257" font-size="8" fill="#C8603A" text-anchor="middle" class="mono">builds your product</text>

  <!-- ── RIGHT: Support agents ── -->
  <text x="758" y="160" font-size="9" fill="#5C5650" font-weight="600" letter-spacing="1.5">SUPPORT</text>

  <!-- Injector -->
  <rect x="752" y="168" width="110" height="26" rx="5" fill="#141210" stroke="#6B4FB8" stroke-width="1"/>
  <text x="762" y="179" font-size="8" fill="#6B4FB8" font-weight="700" class="mono">⚙</text>
  <text x="776" y="179" font-size="9" fill="#B0A8C0" font-weight="600">Injector</text>
  <text x="776" y="189" font-size="7.5" fill="#5C5650">orchestrates pipeline</text>

  <!-- Brief Writer -->
  <rect x="752" y="200" width="110" height="26" rx="5" fill="#141210" stroke="#3A70B0" stroke-width="1"/>
  <text x="762" y="211" font-size="8" fill="#3A70B0" font-weight="700">✎</text>
  <text x="776" y="211" font-size="9" fill="#A0B0C0" font-weight="600">Brief Writer</text>
  <text x="776" y="221" font-size="7.5" fill="#5C5650">preps section context</text>

  <!-- Tracker -->
  <rect x="752" y="232" width="110" height="26" rx="5" fill="#141210" stroke="#2E8A68" stroke-width="1"/>
  <text x="762" y="243" font-size="8" fill="#2E8A68" font-weight="700">◉</text>
  <text x="776" y="243" font-size="9" fill="#A0C0B0" font-weight="600">Tracker</text>
  <text x="776" y="253" font-size="7.5" fill="#5C5650">persists pipeline state</text>

  <!-- Change Mgmt -->
  <rect x="752" y="264" width="110" height="26" rx="5" fill="#141210" stroke="#C8603A" stroke-width="1"/>
  <text x="762" y="275" font-size="8" fill="#C8603A" font-weight="700">⟳</text>
  <text x="776" y="275" font-size="9" fill="#C8A898" font-weight="600">Change Mgmt</text>
  <text x="776" y="285" font-size="7.5" fill="#5C5650">handles pivots</text>

  <!-- Border -->
  <rect width="900" height="320" fill="none" stroke="#2A2420" stroke-width="1" rx="12"/>
</svg>
